<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07070d"/>
      <stop offset="0.65" stop-color="#0b0b1a"/>
      <stop offset="1" stop-color="#05050c"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.55" stop-color="#ff00e0"/>
      <stop offset="1" stop-color="#ffd500"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="floor">
      <rect x="0" y="150" width="1200" height="250"/>
    </clipPath>
  </defs>

  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <!-- horizon glow -->
  <line x1="0" y1="150" x2="1200" y2="150" stroke="#ff00e0" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
  <line x1="0" y1="152" x2="1200" y2="152" stroke="#00f0ff" stroke-width="1" opacity="0.4"/>

  <!-- floor grid -->
  <g clip-path="url(#floor)" opacity="0.16">
    <g stroke="#00f0ff" stroke-width="1">
      <line x1="0" y1="400" x2="1200" y2="400"/>
      <line x1="0" y1="345" x2="1200" y2="345"/>
      <line x1="0" y1="300" x2="1200" y2="300"/>
      <line x1="0" y1="265" x2="1200" y2="265"/>
      <line x1="0" y1="238" x2="1200" y2="238"/>
      <line x1="0" y1="217" x2="1200" y2="217"/>
      <line x1="0" y1="200" x2="1200" y2="200"/>
      <line x1="0" y1="186" x2="1200" y2="186"/>
      <line x1="0" y1="174" x2="1200" y2="174"/>
      <line x1="0" y1="164" x2="1200" y2="164"/>
      <line x1="0" y1="158" x2="1200" y2="158"/>
      <line x1="0" y1="154" x2="1200" y2="154"/>
    </g>
    <g stroke="#ff00e0" stroke-width="1">
      <line x1="90" y1="400" x2="600" y2="150"/>
      <line x1="210" y1="400" x2="600" y2="150"/>
      <line x1="330" y1="400" x2="600" y2="150"/>
      <line x1="450" y1="400" x2="600" y2="150"/>
      <line x1="570" y1="400" x2="600" y2="150"/>
      <line x1="690" y1="400" x2="600" y2="150"/>
      <line x1="810" y1="400" x2="600" y2="150"/>
      <line x1="930" y1="400" x2="600" y2="150"/>
      <line x1="1050" y1="400" x2="600" y2="150"/>
      <line x1="1170" y1="400" x2="600" y2="150"/>
    </g>
  </g>

  <!-- scanlines -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.035">
    <line x1="0" y1="30" x2="1200" y2="30"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="130" x2="1200" y2="130"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="230" x2="1200" y2="230"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="330" x2="1200" y2="330"/>
    <line x1="0" y1="380" x2="1200" y2="380"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#00f0ff" stroke-width="3" fill="none" opacity="0.9">
    <path d="M24 60 L24 24 L60 24"/>
    <path d="M1140 24 L1176 24 L1176 60"/>
    <path d="M1176 340 L1176 376 L1140 376"/>
    <path d="M60 376 L24 376 L24 340"/>
  </g>

  <!-- top status text -->
  <text x="70" y="88" font-family="'Courier New',monospace" font-size="18" fill="#00f0ff" opacity="0.85">// PROFILE.SYS - v2.0 - NIGHT_BUILD</text>
  <text x="1130" y="88" text-anchor="end" font-family="'Courier New',monospace" font-size="18" fill="#ff00e0" opacity="0.85">user: HAMZA_WEB_DEV</text>

  <!-- glitch copies -->
  <g font-family="'Courier New',monospace" font-weight="bold" font-size="120" opacity="0.35">
    <text x="604" y="252" text-anchor="middle" fill="#00f0ff">HAMZA</text>
    <text x="596" y="252" text-anchor="middle" fill="#ff00e0">HAMZA</text>
  </g>

  <!-- title -->
  <text x="600" y="252" text-anchor="middle" font-family="'Courier New',monospace" font-weight="bold" font-size="120" fill="url(#titleGrad)" filter="url(#glow)">HAMZA</text>

  <!-- subtitle -->
  <text x="600" y="302" text-anchor="middle" font-family="'Courier New',monospace" font-size="26" fill="#ffd500">FULL-STACK DEVELOPER // REACT // NODE // MONGODB</text>
  <text x="600" y="334" text-anchor="middle" font-family="'Courier New',monospace" font-size="18" fill="#00f0ff" opacity="0.9">&gt;&gt; BUILDING THE FUTURE, ONE COMMIT AT A TIME</text>

  <!-- footer status -->
  <text x="70" y="352" font-family="'Courier New',monospace" font-size="16" fill="#39ff14" opacity="0.8">SYS.STATUS: ONLINE</text>
  <text x="1130" y="352" text-anchor="end" font-family="'Courier New',monospace" font-size="16" fill="#ffd500" opacity="0.8">INSERT COIN TO CONTINUE</text>
</svg>
